name: ambliopia_game
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flame: ^1.37.0
  flame_audio: ^2.12.1
  flutter:
    sdk: flutter
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: ^2.15.1
  launcher_icons: ^0.16.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/audio/music/
    - assets/audio/piano_hit.wav
    - assets/audio/piano_miss.wav
    - assets/audio/farm_objective.wav
    - assets/audio/farm_goal.wav
    - assets/audio/farm_collision_crush.mp3
    - assets/audio/balloon_pop.mp3
